[package]
name = "penguinwash"
version = "0.1.0"
edition = "2021"
description = "Free, open-source Linux system cleaner"
license = "MIT"
repository = "https://github.com/KovaForge/PenguinWash"

[dependencies]
# GUI — requires GTK4 system library
# gtk4 = { version = "0.9", features = ["v4_14"] }
# libadwaita = { version = "1.6", features = ["v1_4"] }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "fs", "process", "sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# File system
walkdir = "2"

# Directories
dirs = "6"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
once_cell = "1"
regex = "1"

[build-dependencies]

[features]
default = ["cli"]
cli = []
gui = []

[[bin]]
name = "penguinwash"
path = "src/main.rs"

[lib]
name = "penguinwash_lib"
path = "src/lib.rs"
